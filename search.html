<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Search - Online Car Sale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .search-form {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-form h2 {
            margin-bottom: 15px;
            color: #444;
        }

        .form-group {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }

        .search-btn {
            padding: 10px 25px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
        }

        .search-btn:hover {
            background-color: #0056b3;
        }

        .results {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .results h2 {
            margin-bottom: 15px;
            color: #444;
        }

        .car-card {
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #fafafa;
        }

        .car-card h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .car-card p {
            color: #666;
            margin-bottom: 5px;
        }

        .car-card .price {
            color: #e74c3c;
            font-size: 18px;
            font-weight: bold;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Car Sale - Search</h1>

        <div class="search-form">
            <h2>Find Your Car</h2>
            <form action="search.php" method="GET">
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" placeholder="e.g. Camry, Civic">
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" placeholder="e.g. 2022" min="1900" max="2030">
                </div>
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div class="results">
            <h2>Search Results</h2>
            <div class="no-results">
                <p>Enter a model or year above to search for cars.</p>
            </div>
        </div>
    </div>
</body>
</html>
